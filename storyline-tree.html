function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function cardHTML(n){

  const tg = n.children&&n.children.length ? '<div class="tg">▾ 有 '+(n.children.length)+' 条下级分支 · 点击展开/收起</div>' : '';
  let head='';
  if(type==='me'){ head='<div class="ch">'+esc(n.stage||'')+'<span class="age">'+esc(n.age||'')+'</span></div>'; }
  else if(type==='real'){ const cur=n.current?' <span class="you-tag">◀ 当前</span>':''; head='<div class="ch">✓ '+esc(n.stage||'')+cur+'</div>'; }
  else if(type==='route'){ const you=n.you?' <span class="you-tag">◀ 你在此</span>':''; head='<div class="ch">'+esc(n.route||'')+' · '+esc(n.title||'')+you+'</div>'; }
  else if(type==='alt'){ head='<div class="ch">↪ 如果… '+esc(n.stage||'')+'</div>'; }
  else if(type==='sim'){ head='<div class="ch">🌱 '+esc(n.stage||'')+'</div>'; }
  else { head='<div class="ch">'+esc(n.stage||'')+'<span class="age">'+esc(n.age||'')+'</span></div>'; }
  let body='';
  if(n.situation) body+='<div class="ci"><b>处境</b>'+esc(n.situation)+'</div>';
  if(n.choice) body+='<div class="ci"><b>选择</b>'+esc(n.choice)+'</div>';
  if(n.output) body+='<div class="ci"><b>产出</b>'+esc(n.output)+'</div>';

  if(n.echo) body+='<div class="echo">⟲ '+esc(n.echo)+'</div>';
  if(n.from&&n.from.figure){ const m=figureStageRef(n.from.figure,n.from.stageId); if(m){ body+='<div class="from">↳ 模式来源：'+esc(n.from.figure)+' · '+esc(m.stage)+'（'+esc(m.age||'')+'）'+(m.situation?'<div class="ci"><b>其处境</b>'+esc(m.situation)+'</div>':'')+(m.choice?'<div class="ci"><b>其选择</b>'+esc(m.choice)+'</div>':'')+(m.output?'<div class="ci"><b>其产出</b>'+esc(m.output)+'</div>':'')+'</div>'; } }

function figureSimilarity(figure){
  const f=FIG_LIB[figure]; if(!f) return null;
  const sig=myPastSignature();
  const disp = v => (v===undefined||v===null) ? "（未标注）" : fmtVal(v);
  const dims=[["institution","体制位置"],["multi_line","多线并行"],["divergence","发散/专注"],["valley","低谷反应"],["output_form","产出形态"],["ending","结局类型"],["route","人生路线"],["nd_proxy","ND气质"]];
  let hit=0; const matched=[], differ=[];
  dims.forEach(d=>{ const k=d[0], lab=d[1];
    let he = (f.tags && f.tags[k]!==undefined) ? f.tags[k] : undefined;
    if(he===undefined && k==="route") he = f.route;   // storyline 把 route 存在顶层
    const meCur = sig.current.tags ? sig.current.tags[k] : MY_TAGS[k];
    const mePast = sig.past.find(n=>n.tags && String(n.tags[k])===String(he));
    if(meCur!==undefined && String(meCur)===String(he)){ hit++; matched.push(lab+"="+disp(meCur)+"（你当前）"); }
    else if(mePast){ hit++; matched.push(lab+"="+disp(he)+"（你"+esc(mePast.age||"")+"阶段曾如此）"); }
    else { differ.push(lab+"：你(当前)="+disp(meCur)+" / 他="+disp(he)); } });
  return {score:Math.round(hit/dims.length*100), matched, differ, route:f.route, era:f.era, domain:f.domain};
}

    n._x=PAD+l*XG; n._y=n._cy-SIM_NH/2;
  })(root,0,null);
  SIM_W=PAD*2+maxL*XG+SIM_NW; SIM_H=nextY-PAD+SIM_NH/2+PAD;
}
function simCls(n){ return 'sn-'+(n.trend||'flat'); }
function simShort(s){ s=s||''; return s.length>11? s.slice(0,11)+'…':s; }
function simHTML(){
  return '<div class="sim-wrap">'
   +'<p class="sim-hint" style="margin:0 0 6px">互动叙事：<b>每点一个节点 = 你做了一个选择</b>，树往下长一层；每个节点由 <b>你的模块</b> × <b>人物模块</b>（谁的哪一阶段是同类的先例）拼成。走到底给出结局。</p>'
   +'<div class="sim-ctrl"><span class="sim-stat" id="simStat"></span>'
   +'<a onclick="simReset()">🔁 重开</a><a onclick="simRandom()">🎲 随机走一条</a>'
   +'<span>缩放</span><select id="simZoomSel" onchange="simZoom(this.value)"><option value="1">100%</option><option value="0.75">75%</option><option value="0.5" selected>50%</option><option value="0.35">35%</option></select>'
   +'</div><div id="simTree"></div><div id="simPanel"></div></div>';
}
function simRender(){
  if(!SIM_TREE){ SIM_TREE=simBuild(); simLayout(SIM_TREE); }
  const host=document.getElementById('simTree'); if(!host) return;
  const S=SIM_ZOOM;
  let links='', nodes='';
  SIM_NODES.forEach(n=>{ (n.children||[]).forEach(k=>{
    const x1=n._x+SIM_NW, y1=n._cy, x2=k._x, y2=k._cy, mx=(x1+x2)/2;
    const on = SIM_PATH && SIM_PATH.has(n.id) && SIM_PATH.has(k.id);
    links+='<path class="sn-edge'+(on?' sn-edge-on':'')+'" d="M'+x1+' '+y1+' C'+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2+'" fill="none" stroke-width="1.4"'+(SIM_PATH&&!on?' opacity="0.2"':'')+'/>';
  }); });
  SIM_NODES.forEach((n,i)=>{
    const inPath = SIM_PATH && SIM_PATH.has(n.id);
    const dim = SIM_PATH && !inPath;
    const sub = n.ending ? n.ending.t.split(' · ')[0] : (n.tag||'');
    nodes+='<g class="'+simCls(n)+(inPath?' sn-on':'')+'" style="cursor:pointer" onclick="simPick('+i+')"'+(dim?' opacity="0.22"':'')+'>'
      +'<rect x="'+n._x+'" y="'+n._y+'" width="'+SIM_NW+'" height="'+SIM_NH+'" rx="8" stroke-width="1.5"/>'
      +'<text x="'+(n._x+SIM_NW/2)+'" y="'+(n._y+15)+'" text-anchor="middle" font-size="11">'+esc(simShort(n.via))+'</text>'
      +(sub?('<text class="sn-sub" x="'+(n._x+SIM_NW/2)+'" y="'+(n._y+28)+'" text-anchor="middle" font-size="10">'+esc(sub)+'</text>'):'')
      +'</g>';
  });
  host.innerHTML='<svg viewBox="0 0 '+SIM_W+' '+SIM_H+'" width="'+Math.round(SIM_W*S)+'" height="'+Math.round(SIM_H*S)+'">'+links+nodes+'</svg>';
  const st=document.getElementById('simStat');
  if(st) st.textContent='共 '+SIM_NODES.length+' 个节点 · '+SIM_NODES.filter(x=>x.ending).length+' 条结局路径';
}
function simReset(){ SIM_PATH=null; simRender(); const p=document.getElementById('simPanel');
  if(p) p.innerHTML='<div class="sim-note">👆 点任意节点开始走——每点一次前进一层；或按「🎲 随机走一条」直接看一条完整故事线。</div>'; }
function simRandom(){ let n=SIM_TREE; while(n.children&&n.children.length){ n=n.children[Math.floor(Math.random()*n.children.length)]; } const i=SIM_NODES.indexOf(n); if(i>=0) simPick(i); }
function simZoom(v){ SIM_ZOOM=parseFloat(v)||1; simRender(); }

function myPastSignature(){
  const cur = MY_LIFE.find(n=>n.current) || MY_LIFE[MY_LIFE.length-1];
  return {current: cur, past: MY_LIFE.filter(n=>n!==cur)};
}
function realsAges(){ return MY_LIFE.map(m=>m.age||"").join(" → "); }
function buildFigureMirror(figure){
  const f = FIG_LIB[figure]; if(!f) return null;
  return { type:"me", stage:"我的真实生平（基部）→ 若走「"+figure+"」路线",
    children: MY_LIFE.map(m=>({type:"real", stage:m.stage, age:m.age, situation:m.situation, output:m.output, current:m.current}))
      .concat([{ type:"sim", stage:"➡ 接上 "+figure+" 的后续（反事实模拟）", age:f.era,
        situation:"从你的真实起点出发，走 "+figure+" 的模式",
        choice:"借 "+figure+" 的模式："+f.arc, output:"模拟走向 → 见下级分支",
        children:(f.stages||[]).map(st=>({type:"sim", stage:"你→"+st.stage, age:st.age, from:{figure:figure, stageId:st.id}, situation:st.situation, choice:st.choice, output:st.output})) }]) };
}
function simOptions(){ const out=[]; SIM_LV.forEach((lv,i)=>lv.opts.forEach(o=>out.push({via:o.via, lv:i+3, ax:SIM_AX[o.via]}))); return out; }
function simView(v){
  SIM_VIEW = v;
  const t=document.getElementById('simTree'), sp=document.getElementById('simSpace');
  const a=document.getElementById('vTree'), b=document.getElementById('vSpace');
  if(t) t.style.display = (v==='tree')?'block':'none';
  if(sp) sp.style.display = (v==='tree')?'none':'block';
  if(a) a.classList.toggle('on', v==='tree');
  if(b) b.classList.toggle('on', v==='space');
  if(v==='space') simSpaceRender();
}
function simSpaceRender(){
  const map=document.getElementById('spaceMap'); if(!map) return;
  const xs=document.getElementById('axX'), ys=document.getElementById('axY');
  const xk=(xs&&xs.value)||AXES[0].k, yk=(ys&&ys.value)||AXES[1].k;
  const W=680,H=430,L=84,R=30,T=24,B=60, pw=W-L-R, ph=H-T-B;
  const X=v=>L+v*pw, Y=v=>T+(1-v)*ph;
  const xa=axMeta(xk), ya=axMeta(yk);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img">';
  s+='<rect x="'+L+'" y="'+T+'" width="'+pw+'" height="'+ph+'" fill="none" stroke="#3a3a4a"/>';
  for(let i=1;i<4;i++){ const gx=L+i*pw/4, gy=T+i*ph/4;
    s+='<line x1="'+gx+'" y1="'+T+'" x2="'+gx+'" y2="'+(T+ph)+'" stroke="#2a2a36"/>';
    s+='<line x1="'+L+'" y1="'+gy+'" x2="'+(L+pw)+'" y2="'+gy+'" stroke="#2a2a36"/>'; }
  s+='<text x="'+(L+pw/2)+'" y="'+(H-16)+'" fill="#bbb" font-size="12" text-anchor="middle">'+esc(xa.n)+'：'+esc(xa.lo)+' → '+esc(xa.hi)+'</text>';
  s+='<text x="18" y="'+(T+ph/2)+'" fill="#bbb" font-size="12" text-anchor="middle" transform="rotate(-90 18 '+(T+ph/2)+')">'+esc(ya.n)+'：'+esc(ya.lo)+' → '+esc(ya.hi)+'</text>';
  LIFEPATHS.forEach(p=>{ const cx=X(p.ax[xk]), cy=Y(p.ax[yk]);
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="6" fill="#534AB7" stroke="#AFA9EC" stroke-width="1"><title>'+esc(p.n)+'</title></circle>';
    s+='<text x="'+(cx+9)+'" y="'+(cy+4)+'" fill="#cdbcff" font-size="10">'+esc(p.short)+'</text>'; });
  simOptions().forEach(o=>{ if(!o.ax) return; const cx=X(o.ax[xk]), cy=Y(o.ax[yk]); const on = SIM_CUR && SIM_CUR.opt===o.via;
    s+='<rect x="'+(cx-5)+'" y="'+(cy-5)+'" width="10" height="10" rx="2" fill="'+(on?'#e6b422':'#2ecc71')+'" stroke="'+(on?'#fff':'#0b1a11')+'" stroke-width="1"><title>'+esc(o.via)+'</title></rect>'; });
  MY_POINTS.forEach(mp=>{ const cx=X(mp.ax[xk]), cy=Y(mp.ax[yk]);
    const col = mp.t==='now' ? '#e6b422' : (mp.t==='sim' ? '#2ecc71' : '#3498db');
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="6" fill="none" stroke="'+col+'" stroke-width="2"><title>'+esc(mp.n)+'</title></circle>';
    s+='<text x="'+(cx+9)+'" y="'+(cy-8)+'" fill="'+col+'" font-size="10">'+esc(mp.n.replace('你·',''))+'</text>'; });
  s+='</svg>';
  map.innerHTML=s;
}
function openFigure(name){
  const box=document.getElementById('figOut'); if(!box) return;
  box.innerHTML = name ? (figureMirrorHTML(name) + figureCompareHTML(name)) : '';
}
function simBuild(){
  let cid=0;
  const life = MY_LIFE.map((m,k)=>({id:"n"+(++cid), via:m.stage, mine:m.situation+(m.output?(' ｜ 产出：'+m.output):''),
    trend:"now", from:null, peers:[], tag:(m.age||"")+(m.current?' ◀ 当前':''), level:k, opt:"", children:[]}));
  for(let k=0;k<life.length-1;k++) life[k].children.push(life[k+1]);
  const tail=life[life.length-1];
  function mk(o, lv){ return {id:"n"+(++cid), via:o.via, mine:o.mine, trend:o.trend, from:o.from, peers:o.peers||[],
    tag:o.tag||"", level:lv, opt:o.via, children:[]}; }
  SIM_LV[0].opts.forEach(o1=>{ const n1=mk(o1,3);
    SIM_LV[1].opts.forEach(o2=>{ const n2=mk(o2,4);
      SIM_LV[2].opts.forEach(o3=>{ const n3=mk(o3,5);
        SIM_LV[3].opts.forEach(o4=>{ const n4=mk(o4,6); n4.ending=simEnding(o1,o4); n3.children.push(n4); });
        n2.children.push(n3); });
      n1.children.push(n2); });
    tail.children.push(n1); });
  return life[0];
}
function simPick(i){
  const n=SIM_NODES[i]; if(!n) return;
  SIM_CUR=n;
  const chain=[]; (function up(x){ if(x){ chain.unshift(x); up(x.parent); } })(n);
  SIM_PATH=new Set(chain.map(x=>x.id));
  simRender();
  if(SIM_VIEW==='space') simSpaceRender();
  const box=document.getElementById('simPanel'); if(!box) return;
  const srcOf=(f,id)=>{ const m=(typeof figureStageRef==='function')?figureStageRef(f,id):null; if(!m) return '';
    return '<div class="sim-src"><b>模式来源 · 人物模块</b>　'+esc(f)+' · '+esc(m.stage)+(m.age?('（'+esc(m.age)+'）'):'')
      +(m.situation?'<div class="sim-ci">处境 '+esc(m.situation)+'</div>':'')
      +(m.choice?'<div class="sim-ci">选择 '+esc(m.choice)+'</div>':'')
      +(m.output?'<div class="sim-ci">产出 '+esc(m.output)+'</div>':'')
      +'<div class="sim-note"><a id="simFigLink" style="color:#7f77dd;cursor:pointer">→ 打开他的镜像问答 / 对照版</a></div></div>'; };
  let h='<div class="sim-panel"><div class="sim-path"><b>你的路径</b>　'+chain.map(x=>esc(x.via)).join(' <span class="sim-arrow">→</span> ')+'</div>';
  h+='<div class="sim-row"><b>当前节点</b>'+esc(n.via)+(n.tag?(' <span class="chip">'+esc(n.tag)+'</span>'):'')+'</div>';
  if(n.mine) h+='<div class="sim-row"><b>你的模块</b>'+esc(n.mine)+'</div>';
  if(n.from) h+=srcOf(n.from.figure, n.from.stageId);
  if(n.peers&&n.peers.length) h+='<div class="sim-peers"><b>并列先例（同类人物模块）</b>'+n.peers.map(p=>{ const m=(typeof figureStageRef==='function')?figureStageRef(p.figure,p.stageId):null; return '<span class="chip">'+esc(p.figure)+(m?('·'+esc(m.stage)):'')+'</span>'; }).join('')+'</div>';
  if(n.ending) h+='<div class="sim-end '+n.ending.c+'"><b>结局</b>'+esc(n.ending.t)+'<div class="sim-note">'+esc(n.ending.ex)+'</div></div>';
  else h+='<div class="sim-note">继续点下一层 →</div>';
  h+='</div>';
  box.innerHTML=h;
  const lk=document.getElementById('simFigLink');
  if(lk && n.from) lk.onclick=function(){ openFigure(n.from.figure); };
}
(function(){
  const axX=document.getElementById('axX'), axY=document.getElementById('axY');
  if(axX){ AXES.forEach((a,i)=>{ const o=document.createElement('option'); o.value=a.k; o.textContent=a.n; if(i===0)o.selected=true; axX.appendChild(o); }); }
  if(axY){ AXES.forEach((a,i)=>{ const o=document.createElement('option'); o.value=a.k; o.textContent=a.n; if(i===1)o.selected=true; axY.appendChild(o); }); }
  const fs=document.getElementById('figSel');
  if(fs){ Object.keys(FIG_LIB).forEach(n=>{ const o=document.createElement('option'); o.value=n; o.textContent=n+'（'+FIG_LIB[n].route+'）'; fs.appendChild(o); }); }
  renderForks(); simInit();
})();
function simInit(){
  const h=document.getElementById('simHost'); if(h&&!h.innerHTML) h.innerHTML=simHTML();
  simRender();
  const p=document.getElementById('simPanel');
  if(p && !p.innerHTML) p.innerHTML='<div class="sim-note">👆 点任意节点开始走——每点一次前进一层；或按「🎲 随机走一条」直接看一条完整故事线。</div>';
}


</script>
